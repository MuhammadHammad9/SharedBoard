# CoBoard load balancer — TRD §15.1.
#
#   Cloudflare (TLS, DDoS) ─► this nginx ─┬─ /api, /ws, /health ─► server-1..N :3000
#                                        └─ everything else    ─► web :8080 (SPA)
#
# One public origin for the SPA, the REST API and the socket. That is a
# requirement, not a convenience: the refresh cookie is httpOnly, SameSite=Lax
# and scoped to /api/auth, and SocketClient opens wss://<location.host>/ws.
#
# Mounted as /etc/nginx/conf.d/default.conf (infra/docker-compose.prod.yml).

# ── Real client IP behind Cloudflare ─────────────────────────────────────────
# Without this, $remote_addr is a Cloudflare edge address: ip_hash would pin
# whole regions to one instance and the server's per-IP rate limits would treat
# thousands of users as one client.
#
# Trust CF-Connecting-IP ONLY from Cloudflare's published ranges — trusting it
# from anywhere lets a client that reaches the origin directly pick its own IP.
# Generate the list at deploy time (it changes rarely; Cloudflare publishes it):
#
#   { curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6; } \
#     | sed '/^$/d; s/.*/set_real_ip_from &;/' > infra/nginx/cloudflare-realip.conf
#
# then uncomment the include below and mount the file next to this one. Also
# firewall the origin so only Cloudflare ranges can reach :80/:443 at all.
#
# include /etc/nginx/conf.d/cloudflare-realip.conf;
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;

# ── Correlation id ───────────────────────────────────────────────────────────
# Keep a well-formed incoming X-Request-Id (the web client mints one per API
# call, so its id survives end to end), otherwise mint one. Anything else —
# too long, odd characters — is replaced, so a client cannot inject arbitrary
# text into every log line.
#
# The pattern MUST equal SANE_ID in apps/server/src/http/middleware/
# requestContext.ts. If nginx kept an id the server then rejected, the access
# log, the server log and the "Ref:" the user sees would carry different ids.
# $request_id (32 hex chars) always passes it.
map $http_x_request_id $coboard_request_id {
    "~^[A-Za-z0-9_-]{1,64}$"  $http_x_request_id;
    default                   $request_id;
}

# WebSocket upgrade: send `Connection: upgrade` only when the client asked to
# upgrade; plain requests get an empty Connection so upstream keepalive works.
map $http_upgrade $coboard_connection {
    default  upgrade;
    ""       "";
}

# Cloudflare sends X-Forwarded-Proto: https. Reached directly (local compose),
# fall back to the scheme of this hop.
map $http_x_forwarded_proto $coboard_forwarded_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

log_format coboard escape=json
    '{"time":"$time_iso8601","request_id":"$coboard_request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

# ── Upstreams ────────────────────────────────────────────────────────────────
upstream coboard_api {
    # Sticky by client IP (TRD §15.1). An optimisation only — TRD §15.2: every
    # instance subscribes to the Redis pub/sub fan-out, so two users of one
    # board on different instances still see each other's ops. Losing
    # stickiness (an instance dies, a client changes network) costs a
    # reconnect, never correctness.
    ip_hash;

    # One line per instance. Scaling to N: add server-3 … here and in
    # docker-compose.prod.yml, then `nginx -s reload` (docs/RUNBOOK.md §8).
    # max_fails/fail_timeout: a dead instance is skipped for 10 s and its
    # clients re-hash to a live one on reconnect.
    server server-1:3000 max_fails=3 fail_timeout=10s;
    server server-2:3000 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

upstream coboard_web {
    server web:8080;
    keepalive 16;
}

server {
    # TLS terminates at Cloudflare. For "Full (strict)" mode, add
    # `listen 8443 ssl;` with a Cloudflare Origin CA certificate here.
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log coboard;

    # REST bodies are capped at 1 MB by express.json; uploads go straight to
    # S3 via presigned URLs and never pass through here.
    client_max_body_size 2m;

    # Echo the id to the browser so a failed request can be quoted ("Ref:").
    # The server may set it too; hide its copy so there is exactly one header.
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $coboard_request_id always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css application/javascript image/svg+xml text/plain;

    # Shared proxy headers. `proxy_set_header` in a location REPLACES these,
    # so every location below repeats the full set it needs.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $coboard_request_id;
    # The server runs `trust proxy 1`: it believes exactly the LAST entry,
    # which is the one appended here.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $coboard_forwarded_proto;
    proxy_set_header Connection "";

    # ── WebSocket (ops + presence) ──
    location = /ws {
        proxy_pass http://coboard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $coboard_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coboard_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coboard_connection;
        # A board can stay open all day. The server heartbeats well inside
        # this, so the timeout only reaps genuinely dead connections.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Frames must flow immediately — presence is useless 200 ms late.
        proxy_buffering off;
    }

    # ── REST ──
    location /api/ {
        proxy_pass http://coboard_api;
        proxy_read_timeout 30s;
        # Retry another instance only when nothing reached the first one.
        # POST is never retried (nginx default), so an op append cannot be
        # sent twice by the balancer — idempotency keys cover the client side.
        proxy_next_upstream error timeout;
    }

    # Liveness for an external uptime check (PRD §7.3, 99.5%). Answers from
    # whichever instance the caller hashes to.
    location = /health {
        proxy_pass http://coboard_api;
        access_log off;
    }

    # Prometheus scrapes each instance directly on the private network
    # (infra/prometheus/prometheus.yml). /metrics is never public.
    location = /metrics {
        return 404;
    }

    # The load balancer's own probe.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── SPA ──
    location / {
        proxy_pass http://coboard_web;
    }
}
