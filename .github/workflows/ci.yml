name: CI

# The eight gates from docs/04-IMPLEMENTATION-PLAN.md Phase 1 and TRD §14.3.
#
# Two of these exist specifically to enforce conflict resolutions from
# RULES.md §2.3:
#   - bundle-size      → C-4, R-PERF-020
#   - board-chunk      → C-3, R-PERF-021
# Without them, the decision not to adopt GSAP and to confine Framer Motion to
# two chunks decays the first time someone is in a hurry.

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. Pushing a fix cancels the superseded run instead of
# leaving it to finish against a commit nobody is looking at any more — which
# matters most when the run being superseded is a stuck one, since otherwise it
# holds a runner until the job timeout.
#
# `main` is exempt: a push to main is the record of what was merged, and
# cancelling it would leave a merged commit with no completed CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# NOTE: do not set PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD here. GitHub runners ship no
# browser, so skipping the download turns the e2e job's `playwright install`
# into a no-op and the tests then fail with a missing executable. Sandboxes that
# DO ship a preinstalled Chromium use the opt-in PLAYWRIGHT_CHROMIUM_EXECUTABLE
# override in playwright.config.ts instead.

jobs:
  quality:
    name: Types, lint, tests
    runs-on: ubuntu-latest

    # Phase 7 brings the first code that cannot be honestly tested without a
    # database. The auth suite is almost entirely integration tests, and an
    # integration test that mocks Prisma verifies nothing about Postgres --
    # not the unique constraints, not the cascade deletes, not the
    # transaction that revokes a token family. So CI gets real services.
    #
    # These mirror docker-compose.yml exactly, so a failure here reproduces
    # locally with `bash scripts/dev-services.sh`.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coboard
          POSTGRES_PASSWORD: coboard
          POSTGRES_DB: coboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coboard -d coboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coboard:coboard@localhost:5432/coboard
      REDIS_URL: redis://localhost:6379
      # Test-only values. Real secrets never appear in a workflow file
      # (R-SEC-016); these exist so the JWT module has something to sign with.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma Client is generated code and is NOT committed, so it must be
      # produced before typecheck -- the server imports its types.
      - name: Generate Prisma Client
        run: pnpm --filter @coboard/server exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @coboard/server exec prisma migrate deploy

      # Gate 1 — blocking
      - name: Typecheck
        run: pnpm typecheck

      # Gate 2 — blocking, zero warnings tolerated
      - name: Lint
        run: pnpm lint

      # Gate 3 — blocking
      - name: Unit and integration tests
        run: pnpm test

      # Gate 4 — blocking. C-3 / R-PERF-021.
      - name: Board chunk contains no animation library
        run: pnpm check:board-chunk

  bundle:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gate 5 — blocking. PRD §7.1: initial ≤250 KB gz, board ≤200 KB gz.
      - name: Build and check budgets
        run: pnpm analyze

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: apps/web/stats.html
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gate 6 — blocking on high/critical. R-SEC-019.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Gate 7 — blocking on main, advisory on PRs. TRD §14.3.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    # The suite itself runs in ~4 minutes. Without a cap, a hung step — an
    # apt mirror that stops responding during `playwright install --with-deps`
    # is the one we have actually hit — burns the default 6-hour job timeout
    # and leaves the PR reporting "in progress" all day. 25 minutes is roughly
    # five times the real runtime: generous for a slow runner, decisive about
    # a stuck one.
    timeout-minutes: 25

    # Phase 8's suite drives the real stack: browser → Vite → Express →
    # Postgres. AT-10 asks whether the work is still there after a refresh,
    # and that question has no meaning against a stubbed API.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coboard
          POSTGRES_PASSWORD: coboard
          POSTGRES_DB: coboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coboard -d coboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coboard:coboard@localhost:5432/coboard
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @coboard/server exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @coboard/server exec prisma migrate deploy

      # Split from the system dependencies below so the browser download —
      # the large, cacheable half — is skipped on a hit. The apt half cannot
      # be cached and has to run either way.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        timeout-minutes: 10

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 10

      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    # Gate 8 — advisory. TRD §14.3.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Lighthouse CI is advisory and is wired in Phase 15,"
          echo "when the landing page and dashboard exist to measure."
          echo "Budgets: landing LCP <= 1.5s on 4G, dashboard interactive <= 2.0s."
