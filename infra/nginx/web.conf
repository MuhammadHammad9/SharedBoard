# CoBoard SPA — static server inside the web image (apps/web/Dockerfile).
#
# This file is an nginx image TEMPLATE: at container start the entrypoint
# substitutes ${CSP_*} from the environment (NGINX_ENVSUBST_FILTER=CSP_ keeps
# nginx's own $variables untouched) and writes /etc/nginx/conf.d/default.conf.
#
#   CSP_IMG_ORIGINS      where board images and thumbnails are READ from —
#                        the origin of S3_PUBLIC_URL, or of S3_ENDPOINT/S3_BUCKET
#   CSP_CONNECT_ORIGINS  where the browser PUTs presigned uploads — the origin
#                        of S3_ENDPOINT (add the read origin too: exports fetch)
#
# It sits BEHIND infra/nginx/lb.conf, which owns TLS-facing concerns, gzip for
# the API and X-Request-Id. /api and /ws never reach this server.

map $uri $coboard_cache_control {
    # Vite content-hashes everything under /assets/: a changed file is a new
    # URL, so a year plus `immutable` is safe and saves revalidation requests.
    ~^/assets/  "public, max-age=31536000, immutable";
    # index.html and app.html (every SPA route is one of the two) must revalidate
    # on every load, or a deploy leaves users on HTML that points at assets
    # the previous image had and this one does not.
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Generated at image build time by infra/nginx/csp-hashes.mjs: the sha256
    # of each inline <script> in index.html (the PRD §7.6 nomodule fallback).
    include /etc/nginx/snippets/csp-hashes.conf;

    # One place for every response header. A location-level add_header would
    # silently drop all of these, which is why caching is a map, not per-location.
    add_header Cache-Control $coboard_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS is safe here only because Cloudflare serves HTTPS exclusively;
    # see docs/RUNBOOK.md §11 before enabling `preload`.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script-src: the bundle is same-origin modules; no eval, no CDN.
    # style-src 'unsafe-inline': index.html's fallback screen uses style
    #   attributes. React's `style` prop goes through CSSOM and needs nothing.
    # img-src blob: data: — pasted images preview from object URLs, exports
    #   rasterise to data URLs (FR-CANVAS-010, export).
    # connect-src 'self' covers /api and the same-origin wss:// socket.
    # Inter is a system-font stack (PRD §15); no font CDN is loaded.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_IMG_ORIGINS}; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_ORIGINS}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets: a miss is a real 404, never index.html. Serving HTML for
    # a stale chunk URL turns a clean "chunk failed to load" into a MIME error.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Source maps are deleted at build time; refuse them even if one slips in.
    location ~* \.map$ {
        return 404;
    }

    # Client-side routing: every unknown path is the app.
    # `/` is the prerendered S-01 landing (apps/web/scripts/prerender.ts);
    # every other route falls back to the plain SPA shell, app.html.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri /app.html;
    }

    # The image's own liveness probe — not proxied from the LB.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
